<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero-Trust Vault Drive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Top Search Header -->
  <header class="h-16 border-b border-slate-800 bg-slate-900/80 px-4 flex items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center space-x-3 w-48">
      <div class="bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/30">
        <i class="fa-solid fa-shield-halved text-emerald-400 text-lg"></i>
      </div>
      <span class="font-bold text-base bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent hidden sm:inline">
        Vault Drive
      </span>
    </div>

    <!-- Center Search Bar -->
    <div class="flex-1 max-w-xl">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
        <input type="text" placeholder="Get answers from Zero-Trust Drive..." class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition">
      </div>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center space-x-2">
      <button class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs px-3 py-2 rounded-lg flex items-center space-x-2 shadow-md">
        <i class="fa-solid fa-wallet"></i>
        <span class="hidden sm:inline">Connect Wallet</span>
      </button>
    </div>
  </header>

  <div class="flex-1 flex">
    <!-- Left Navigation Sidebar -->
    <aside class="w-16 sm:w-56 border-r border-slate-800 bg-slate-900/40 p-3 flex flex-col space-y-4">
      <button class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm py-2.5 px-4 rounded-xl flex items-center justify-center sm:justify-start space-x-2 shadow-lg transition">
        <i class="fa-solid fa-plus text-base"></i>
        <span class="hidden sm:inline">New Upload</span>
      </button>

      <nav class="space-y-1 text-sm font-medium">
        <a href="#" class="flex items-center space-x-3 bg-emerald-500/10 text-emerald-400 p-2.5 rounded-xl border border-emerald-500/20">
          <i class="fa-solid fa-house text-base"></i>
          <span class="hidden sm:inline">Home</span>
        </a>
        <a href="#" class="flex items-center space-x-3 text-slate-400 hover:bg-slate-800/60 p-2.5 rounded-xl transition">
          <i class="fa-solid fa-folder text-base"></i>
          <span class="hidden sm:inline">My Vault</span>
        </a>
        <a href="#" class="flex items-center space-x-3 text-slate-400 hover:bg-slate-800/60 p-2.5 rounded-xl transition">
          <i class="fa-solid fa-share-nodes text-base"></i>
          <span class="hidden sm:inline">Shared</span>
        </a>
        <a href="#" class="flex items-center space-x-3 text-slate-400 hover:bg-slate-800/60 p-2.5 rounded-xl transition">
          <i class="fa-solid fa-clock-rotate-left text-base"></i>
          <span class="hidden sm:inline">Recent</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content Grid -->
    <main class="flex-1 p-4 sm:p-6 space-y-6 overflow-y-auto">
      <div>
        <h2 class="text-xl font-bold tracking-tight">Welcome to Vault Drive</h2>
        <p class="text-xs text-slate-400 mt-1">Zero-Trust IPFS Storage • Client-side AES-256 Encrypted</p>
      </div>

      <!-- Suggested Folders Grid -->
      <div class="space-y-2">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Suggested Folders</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between hover:border-slate-700 transition">
            <div class="flex items-center space-x-3">
              <i class="fa-solid fa-folder text-emerald-400 text-lg"></i>
              <span class="text-xs font-semibold truncate">zero-trust-ppt</span>
            </div>
            <i class="fa-solid fa-ellipsis-vertical text-slate-500 text-xs"></i>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between hover:border-slate-700 transition">
            <div class="flex items-center space-x-3">
              <i class="fa-solid fa-folder text-emerald-400 text-lg"></i>
              <span class="text-xs font-semibold truncate">encrypted-docs</span>
            </div>
            <i class="fa-solid fa-ellipsis-vertical text-slate-500 text-xs"></i>
          </div>
        </div>
      </div>

      <!-- Files Card Display -->
      <div class="space-y-3">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Encrypted Files</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-3">
            <div class="flex justify-between items-start">
              <span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-mono px-2 py-0.5 rounded border border-emerald-500/20">AES-256</span>
              <i class="fa-solid fa-file-pdf text-red-400 text-2xl"></i>
            </div>
            <div>
              <p class="text-xs font-bold truncate">Zero-Trust-Vault-Specs.pdf</p>
              <p class="text-[10px] text-slate-500 mt-0.5">Uploaded • Aug 2026</p>
            </div>
          </div>

          <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-3">
            <div class="flex justify-between items-start">
              <span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-mono px-2 py-0.5 rounded border border-emerald-500/20">AES-256</span>
              <i class="fa-solid fa-file-lines text-blue-400 text-2xl"></i>
            </div>
            <div>
              <p class="text-xs font-bold truncate">AWS-Ledger-Report.docx</p>
              <p class="text-[10px] text-slate-500 mt-0.5">Uploaded • Aug 2026</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
